 if(isNoPromo(c))return '最近怎么样呀？想起我们之前聊的那件事，来跟你打声招呼～';
 if(c.stage>=8)return '之前真的谢谢你的信任～想问问你的旅行想法有没有变化，有需要我帮忙的地方尽管说呀。';
 if(kind==='pro')return '上次交流之后，我想确认一下，你现在对旅行方面有什么具体需求吗？如果没有，我们就先正常交流。';
 if(kind==='warm')return `哈喽${c.name}～突然想到之前我们聊的事情，就想来关心一下你最近怎么样啦😊`;

};

function showCaseSearch(){const q=el('caseSearch').value.trim().toLowerCase();el('casesResult').innerHTML=renderCases(TEACHER_CASES.filter(k=>(k.title+k.id).toLowerCase().includes(q)).slice(0,16));}
function caseExplain(id){const c=TEACHER_CASES.find(x=>x.id===id);if(!c)return;openModal(`<h2>📒 销售案例 ${esc(id)}</h2>`,`<div class="resultarea"><h3>${esc(c.title)}</h3><p class="small">这是公开体验版的一条通用销售原则，未包含老师的私有课程原文。</p><p class="smallmuted">使用原则：结合客户真实需求，尊重拒绝，不把教师方法作为强制成交脚本。</p></div><button class="btn margintop" onclick="closeModal()">返回</button>`)}
function parseChat(text){const out={};const reject=/暂时不想做副业|不想做副业|不考虑副业|不想参与推广|不要再推|别再推荐|停止联系|不用再介绍|不要营销/.test(text);const noNeed=/没有需求|暂无需求|暂时不需要|目前不考虑/.test(text);const interest=/想先了解|想了解一下|有兴趣|想看看|考虑看看|怎么收费|多少钱|怎么合作/.test(text);out.reject=reject;out.noNeed=noNeed;out.interest=interest;out.stageHint=reject?'应停止相应营销':interest?'存在了解意愿，但不能视为购买承诺':'暂无明确购买意愿';out.details=reject?'发现可能的明确拒绝语句，请人工确认拒绝的产品类型。':noNeed?'提到暂时没有需求，不应自动设置营销跟进。':interest?'出现了解/询价信号，可先问对方最关心的问题。':'需要更多双方真实聊天，才能判断客户需求。';return out}
function runLocalAnalysis(){const id=el('chatClient').value,text=el('chatRaw').value.trim();if(!id){toast('请选择客户档案');return}if(!text){toast('请先粘贴聊天文字');return}const c=get(id);if(!c)return;const result=parseChat(text);analysis={clientId:id,text,signals:result};const replies=result.reject?['明白啦，没关系！我们先不聊这个，祝你最近一切顺利～','谢谢你直接告诉我你的想法，我尊重你的选择。','收到，我不会继续向你推荐这项合作。']:result.noNeed?['明白～有需要的时候再说就好，平时还是可以聊聊天哈哈哈。','理解的！那你先忙手头上的事情，以后有新想法再交流呀。','收到，目前先不推进产品；如果需要相关信息，随时告诉我。']: [replyFor(c),replyFor(c,'warm'),replyFor(c,'pro')];analysis.replies=replies;
el('chatResults').innerHTML=`<div class="resultarea"><b>🧩 聊天提要（规则初筛）</b><div class="small margintop">${esc(result.details)}</div><div class="small"><b>意向判断：</b>${esc(result.stageHint)}</div><div class="small"><b>当前销售阶段：</b>仍建议人工核实，暂不自动推进。</div><div class="small"><b>沟通改进：</b>避免连续追问或在拒绝后继续销售。</div></div><h3>✨ 下一句话怎么回复？</h3><div class="replies">${['🌷 自然朋友版','❤️ 温暖亲切版','🎯 专业沟通版'].map((style,i)=>`<div class="replybox"><strong>${style}</strong><p>${esc(replies[i])}</p><button class="btn sm soft" onclick="copyReply(${i})">复制这句话</button></div>`).join('')}</div><div class="notearea margintop">将这次聊天加入 ${esc(c.name)} 的档案前，请检查姓名、语义和截图中的双方身份是否正确。规则不会自动推断职业、收入或成交。</div><div class="field margintop"><label>保存到客户档案的简短摘要（可编辑）</label><textarea class="textarea" style="min-height:80px" id="analysisSummary">${esc(result.details)}</textarea></div><div class="formrow margintop"><label class="small"><input type="checkbox" id="setNoPromo" ${result.reject?'checked':''}/> 对方明确拒绝旅游推广副业（需人工确认）</label></div><button class="btn primary margintop" onclick="commitAnalysis()">✅ 确认后保存到客户档案</button>`;
}
async function copyReply(i){if(!analysis)return;try{await navigator.clipboard.writeText(analysis.replies[i]);toast('已复制到剪贴板')}catch(e){toast('浏览器未授权剪贴板，请手动选中文字')}}
function commitAnalysis(){if(!analysis)return;const c=get(analysis.clientId);if(!c)return;const summary=el('analysisSummary').value.trim()||'本次聊天已导入';const noPromo=el('setNoPromo').checked;c.events=c.events||[];c.events.push({date:TODAY(),title:'新导入微信聊天',summary:summary+'\n\n原始文字（不代表AI核验）：\n'+analysis.text.slice(0,9000),source:'用户粘贴聊天 · 手动核对',verified:true});c.lastTopic=summary;c.lastDate=TODAY();c.lastMessage='未区分最新客户消息';if(noPromo){c.noPromoTypes=Array.from(new Set([...(c.noPromoTypes||[]),'旅游推广']));c.contact='nurture';c.grade='E'}else if(analysis.signals.interest&&!isNoPromo(c)){if(c.grade==='D')c.grade='C'}c.confirmed=true;save();chatClientId=c.id;analysis=null;toast('已保存聊天摘要与原文到客户档案');render();}
function tasksPage(){const tasks=state.tasks.slice().sort((a,b)=>(a.done-b.done)||String(a.date).localeCompare(String(b.date)));const today=TODAY();return `<div class="sectiontitle"><div><h2>📅 跟进计划</h2><div class="lead">任务只根据你自己设定的日期提醒，不会擅自向客户发送消息</div></div><button class="btn primary" onclick="newTask()">＋ 添加任务</button></div><div class="card">${tasks.map(t=>`<div class="taskline"><div><div class="strong" style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.title)} ${t.date<=today&&!t.done?'<span class="pill B">到期</span>':''}</div><div class="tiny">${esc(get(t.clientId)?.name||'个人任务')} · ${esc(t.date||'无日期')} ${t.note? '· '+esc(t.note):''}</div></div><div class="formrow"><button class="btn sm" onclick="openClient('${t.clientId}')" ${get(t.clientId)?'':'disabled'}>看客户</button>${t.done?'<span class="pill D">已完成</span>':`<button class="btn sm primary" onclick="completeTask('${t.id}')">完成跟进</button>`}<button class="btn sm red" onclick="deleteTask('${t.id}')">删除</button></div></div>`).join('')||'<div class="empty">还没有跟进任务。<br>可以为真正有约定的客户设置联系日期。</div>'}</div>`}
function newTask(id=''){let selected=id?get(id):null;openModal('<h2>🗓️ 新建跟进任务</h2>',`<div class="formgrid"><div class="field"><label>关联客户</label><select id="taskClient" class="sel">${'<option value="">个人任务</option>'+state.clients.map(c=>`<option value="${esc(c.id)}" ${selected&&selected.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>提醒日期</label><input type="date" id="taskDate" class="input" value="${TODAY()}"></div></div><div class="field margintop"><label>任务内容</label><input class="input" id="taskTitle" style="width:100%" value="${selected?'联系'+esc(selected.name)+'，确认近况':''}" placeholder="例如：给小王回复他上次的问题"></div><div class="field margintop"><label>备注（可选）</label><textarea id="taskNote" class="textarea" style="min-height:65px" placeholder="约定了什么？注意哪些问题？"></textarea></div><button class="btn primary margintop" onclick="saveTask()">保存跟进任务</button>`)}
function saveTask(){const title=el('taskTitle').value.trim(),date=el('taskDate').value,clientId=el('taskClient').value;if(!title||!date){toast('请填写任务内容和日期');return}const c=get(clientId);if(c&&c.contact==='stop'){if(!confirm('该客户标记为停止营销，确认此任务只用于必要服务或非营销沟通吗？'))return}state.tasks.push({id:mkid(),title,date,clientId,note:el('taskNote').value.trim(),done:false});save();closeModal();render();toast('跟进任务已创建')}
function completeTask(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;openModal('<h2>✅ 完成跟进</h2>',`<div class="notearea">${esc(task.title)} · ${esc(get(task.clientId)?.name||'个人任务')}</div><div class="field margintop"><label>本次沟通结果（不必长篇）</label><textarea id="completeText" class="textarea" style="min-height:85px" placeholder="例如：确认客户暂不需要，已回复；下一次等待对方主动咨询"></textarea></div><div class="field margintop"><label>下一次联系日期（可选，不强制）</label><input id="nextTaskDate" type="date" class="input"></div><button class="btn primary margintop" onclick="finishTask('${id}')">保存结果并完成</button>`)}
function finishTask(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;task.done=true;const summary=el('completeText').value.trim(),date=el('nextTaskDate').value;if(task.clientId&&get(task.clientId)&&summary){let c=get(task.clientId);c.events.push({date:TODAY(),title:'已完成跟进',summary,source:'手动记录',verified:true});c.lastTopic=summary;c.lastDate=TODAY()}if(date){state.tasks.push({id:mkid(),title:'继续跟进：'+task.title.replace(/^继续跟进：/,'').slice(0,40),date,clientId:task.clientId,note:'用户手动安排',done:false})}save();closeModal();render();toast('已完成并保存结果')}
function deleteTask(id){if(!confirm('确定删除这条任务吗？'))return;state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}
function openModal(head,body){el('modal').innerHTML=`<div class="modalhead">${head}<button class="iconbtn" title="关闭" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div>`;el('modalback').classList.add('show')};function closeModal(){el('modalback').classList.remove('show')}
function openSettings(){openModal('<h2>⚙️ 数据与使用说明</h2>',`<div class="notearea">${PRIVATE_VERSION?'🔒 <b>私人版含真实客户复盘</b>，不要把此HTML文件或包含客户资料的备份发给别人。':'✅ <b>公开分享版</b>不包含任何真实客户信息。'}<br/>此版本采用浏览器本地存储：关闭后通常会保留，换电脑/换浏览器不会同步；清理浏览器记录可能导致丢失。</div><h3>📦 数据备份、私人客户档案导入</h3><div class="formrow"><button class="btn primary" onclick="exportJSON()">⇩ 导出全部客户与任务 JSON</button><label class="filelabel">📥 合并导入历史客户档案<input type="file" accept=".json,application/json" hidden onchange="mergePrivateArchive(this)"></label><label class="filelabel">⇧ 完整恢复 JSON 备份<input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label></div><p class="smallmuted">「合并导入」接受只有 clients 的历史复盘 JSON，保留当前客户和跟进任务，按姓名＋原始出处去除重复；「完整恢复」才会替换原数据，请先备份。数据只在本机处理，不会上传网站服务器。复盘内容不等于微信逐字聊天、购买意向或已核验付款。</p><h3 class="margintop">📌 当前版本的实际能力</h3><p class="small">✅ 客户查询、资料修改、时间轴、任务提醒、完成记录、规则回复、知识库索引。<br/>🚧 尚未实现：云端账号、多设备同步、微信截图OCR、真正大模型在线分析。</p><div class="formrow margintop"><button class="btn" onclick="downloadInfo()">查看导入资料说明</button><button class="btn red" onclick="clearAll()">清空本地数据</button></div>`)}
function downloadInfo(){openModal('<h2>🔎 导入资料说明</h2>',`<div class="notearea">私人版客户来自用户上传的《粘贴的文本 (1)(1).txt》复盘；该文档缺少完整原始微信消息，因此大部分客户档案标为“待核对”。同名客户暂不合并，成交状态仅按复盘原文记录，不统计虚构收入。<br/>老师的100个销售案例目前仅提取了编号与标题，相关方法用于保守的回复规则，不表示完整教学内容已经程序化。</div><button class="btn margintop" onclick="openSettings()">返回设置</button>`)}
function exportJSON(){const content=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='销售聚宝盆-'+(PRIVATE_VERSION?'私人备份':'公开版备份')+'-'+TODAY()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500);toast('备份文件已开始下载')}
function mergePrivateArchive(input){
 const f=input.files?.[0];if(!f)return;input.value='';
 if(f.size>12000000){alert('文件超过12MB，请先分批导入');return}
 const rd=new FileReader();rd.onload=()=>{try{
  const data=JSON.parse(rd.result);
  if(!Array.isArray(data.clients)||data.clients.length>4000||!data.clients.every(c=>c&&typeof c==='object'&&!Array.isArray(c)&&typeof c.name==='string'&&c.name.trim().length>0))throw Error('文件应包含有效的 clients 客户档案数组（上限4000条）');
  const key=c=>`${String(c.name||'').trim()}\u0001${String(c.sourceRef||c.id||'').trim()}`;
  const known=new Set(state.clients.map(key));const ids=new Set(state.clients.map(c=>c.id));
  const fresh=[];let duplicates=0;
  for(const original of data.clients){
   const k=key(original);if(known.has(k)){duplicates++;continue}
   const c={...original};
   if(typeof c.id!=='string'||!c.id||ids.has(c.id)){do{c.id='import_'+mkid()}while(ids.has(c.id))}
   if(!Array.isArray(c.events))c.events=[];
   if(!Array.isArray(c.noPromoTypes))c.noPromoTypes=[];
   c.confirmed=Boolean(c.confirmed);
   known.add(k);ids.add(c.id);fresh.push(c);
  }
  if(!fresh.length){alert('没有新增档案：'+duplicates+'条已存在，未覆盖你之前编辑过的内容。');return}
  if(!confirm(`准备合并 ${fresh.length} 条新客户档案（跳过 ${duplicates} 条同来源重复记录）。\n\n不会覆盖当前的 ${state.clients.length} 条客户和 ${state.tasks.length} 条跟进任务。\n\n注意：历史复盘不等于微信聊天原文；成交状态需要你核验付款凭证。\n\n确定导入到此浏览器？`))return;
  state.clients.push(...fresh);save();closeModal();clientFilter='';gradeFilter='all';statusFilter='all';go('clients');toast(`成功合并 ${fresh.length} 条历史档案；重复 ${duplicates} 条已跳过`)
 }catch(e){alert('合并导入失败：'+e.message)}};
 rd.onerror=()=>alert('本地文件读取失败，请重新选择文件');rd.readAsText(f,'utf-8');
}
function importJSON(input){const f=input.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let data=JSON.parse(rd.result);if(!Array.isArray(data.clients)||!Array.isArray(data.tasks))throw Error('缺少clients/tasks');if(!confirm(`将导入 ${data.clients.length} 条客户档案，替换当前数据，确定继续吗？`))return;state=data;if(!state.settings)state.settings={goal:3,mood:''};save();closeModal();render();toast('数据恢复成功')}catch(e){alert('导入失败：'+e.message)}};rd.readAsText(f,'utf-8')}
function clearAll(){if(prompt('清空会删除全部客户与任务，请输入“删除”确认')!=='删除')return;state={clients:[],tasks:[],settings:{goal:3,mood:''}};save();closeModal();render();toast('已清空本地数据')}
render();
</script></body></html>
