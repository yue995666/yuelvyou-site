name = "sales-coach-v5-api"
main = "worker.mjs"
compatibility_date = "2026-11-01"
# Add a dedicated API domain in Cloudflare; never redirect the existing Pages site.
[vars]
ALLOWED_ORIGIN = "https://yuelvyou.cn"
OPENAI_MODEL = "gpt-4.1-mini"
# SUPABASE_URL, SUPABASE_ANON_KEY and OPENAI_API_KEY: wrangler secret put (server only).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
